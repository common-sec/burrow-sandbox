# Dependabot keeps pinned dependencies current (D1). Checked every day.
# - Version updates wait for a 7-day cooldown, the same as mise's minimum_release_age: a release
#   is only proposed once it has been public for a week. Security updates skip the cooldown.
# - Minor and patch updates come as ONE grouped PR per ecosystem; majors one PR each, to review.
# - Security updates come grouped per ecosystem too. They need "Dependabot security updates"
#   switched on in the repository (Settings > Advanced Security); this file only shapes the PRs.
# - Review: the security team, through .github/CODEOWNERS (Dependabot's `reviewers` option was
#   removed in May 2025 in favour of code owners).
# - One PR across ecosystems (multi-ecosystem-groups) is not used: as documented it cannot be
#   limited to minor and patch, so majors would hide inside it (docs/decisions/0006).
# Not covered by Dependabot: mise.toml, the built-in presets (presets/*.preset) and
# scripts/install-mise.sh (see docs/DEVELOPMENT.md, "Updating pins").
version: 2

updates:
  # Go modules (go.sum).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps(go)"

  # Base images of the proxy and forwarder images (pinned by tag + digest).
  - package-ecosystem: docker
    directories: ["/packaging/proxy", "/packaging/forward"]
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps(docker)"

  # Scanner images (compose.yaml, pinned by tag + digest).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps(compose)"

  # GitHub Actions (pinned by commit SHA).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"
