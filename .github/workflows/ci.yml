name: CI

# CI runs the same mise tasks a developer runs locally (local first). Nothing but GitHub's own
# checkout action is used, pinned by commit SHA; mise is installed from a checksum-verified
# release (scripts/install-mise.sh), and every tool from mise.lock.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, test, vuln, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise (pinned, checksum verified)
        run: sh scripts/install-mise.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: mise.lock matches mise.toml
        run: |
          mise lock --platform linux-x64,linux-arm64,macos-x64,macos-arm64,windows-x64
          git diff --exit-code mise.lock || { echo "::error::mise.lock is out of date; run 'mise lock' and commit it"; cat mise.lock; exit 1; }
      - name: Install tools from mise.lock
        run: mise install
      - run: mise run check
      - name: Checksums of this build
        run: cat dist/SHA256SUMS

  scan:
    name: scan (${{ matrix.scan }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scan: [secrets, sast, deps]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # full history, so the secrets scan sees every commit
      - name: ${{ matrix.scan }} (rootless podman, same script as `mise run scan`)
        run: sh scripts/scan.sh ${{ matrix.scan }}

  e2e:
    name: end-to-end on rootless Podman
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise (pinned, checksum verified)
        run: sh scripts/install-mise.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mise install go
      - run: podman --version
      - run: mise run e2e
