name: Sandbox images

# Builds and scans the sandbox images of the test presets (test/images: ubuntu, kali and the
# agents), one job each, when they change and every week (new vulnerabilities appear in images
# that did not change). Secrets fail a job; vulnerabilities are reported in the log (decision 0009).
# Kept out of ci.yml: the agent images are 1 to 2 GB each.
on:
  pull_request:
    paths: ["test/images/**", "test/presets/**", "scripts/images.sh", "scripts/scan.sh", ".github/workflows/sandboxes.yml"]
  push:
    branches: [main]
    paths: ["test/images/**", "test/presets/**"]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        name: [ubuntu, kali, claude, codex, opencode, pi, hermes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (pinned base, lockfile with hashes)
        run: sh scripts/images.sh sandboxes ${{ matrix.name }}
      - name: Starts as the sandbox user and the tool answers
        run: |
          case "${{ matrix.name }}" in
            ubuntu|kali) cmd="sh -c 'id -u; cat /etc/os-release'" ;;
            hermes) cmd="hermes --help" ;;
            *) cmd="${{ matrix.name }} --version" ;;
          esac
          eval podman run --rm --user 1000:1000 -e HOME=/tmp/home --cap-drop ALL \
            --security-opt no-new-privileges --network none "localhost/burrow-test-${{ matrix.name }}:dev" "$cmd"
      - name: Scan (secrets fail; vulnerabilities reported)
        run: sh scripts/scan.sh sandboxes ${{ matrix.name }}
