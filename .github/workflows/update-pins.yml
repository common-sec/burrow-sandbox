name: Update pins Dependabot cannot see

# Dependabot does not read scripts/install-mise.sh. Once a day this checks for a mise release
# that has passed the 7-day cooldown and opens a PR with the new version and its checksums from
# the release's SHASUMS256.txt, for the security team to review (CODEOWNERS).
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
# A PR opened with GITHUB_TOKEN does not start CI by itself: a reviewer pushes to it or closes and
# reopens it (GitHub's rule against workflow loops); a GitHub App token would remove that step.
# Not covered yet: mise.toml tool versions (by hand, docs/DEVELOPMENT.md) and image constants in
# Go tests.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mise:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write        # push the update branch
      pull-requests: write   # open the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: New mise release past the cooldown?
        id: mise
        run: echo "version=$(sh scripts/update-mise.sh)" >> "$GITHUB_OUTPUT"
      - name: Check the new pin installs (checksums verified)
        if: steps.mise.outputs.version != ''
        run: sh scripts/install-mise.sh "$RUNNER_TEMP/bin"
      - name: Open a PR
        if: steps.mise.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.mise.outputs.version }}
        run: |
          branch="pins/mise-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then echo "already proposed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "deps(mise): install-mise.sh to mise $VERSION (D1)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "deps(mise): mise $VERSION" \
            --body "mise $VERSION has passed the 7-day cooldown. Version and SHA-256 checksums from the release's SHASUMS256.txt (scripts/update-mise.sh). Review the release notes before merging."
