# Scanner images, pinned by tag (for humans and Dependabot) and multi-platform digest (what runs).
# scripts/scan.sh reads the images from here and runs them with its own hardening, on podman or
# docker: `mise run scan`. The services also work as-is with `podman compose` / `docker compose`.
# All: non-root, no capabilities, read-only root filesystem, repository mounted read-only.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "1000:1000"
  tmpfs: ["/tmp:rw,size=512m"]
  environment:
    HOME: /tmp

services:
  trufflehog:
    image: docker.io/trufflesecurity/trufflehog:3.99.8@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a
    <<: *hardening
    network_mode: none
    volumes: ["./:/work:ro"]
    entrypoint: ["trufflehog", "filesystem", "/work", "--no-update", "--no-verification", "--fail",
                 "--exclude-paths", "/work/.trufflehog-exclude"]

  semgrep:
    image: docker.io/semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed
    <<: *hardening
    working_dir: /work
    volumes: ["./:/work:ro"]
    command: ["semgrep", "scan", "--metrics=off", "--error", "--config", "p/golang", "/work"]

  trivy:
    image: docker.io/aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    <<: *hardening
    volumes: ["./:/work:ro", "./.cache/trivy:/cache"]
    command: ["fs", "--cache-dir", "/cache", "--exit-code", "1", "--severity", "HIGH,CRITICAL", "/work"]
